name: Generate Product Descriptions (Batch)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'submit'
        type: choice
        options:
          - submit
          - status
          - preview
          - download
          - realtime
          - realtime-live
          - apply

      model_provider:
        description: 'AI model to use'
        required: true
        default: 'claude'
        type: choice
        options:
          - claude
          - openai

      product_filter:
        description: 'Which products to process'
        required: true
        default: 'all_active'
        type: choice
        options:
          - all_active
          - all_products
          - needs_description
          - short_description
          - by_type
          - by_vendor
          - by_tag

      product_type:
        description: 'Product type (only if filter = by_type)'
        required: false
        type: string
        default: ''

      vendor:
        description: 'Vendor name (only if filter = by_vendor)'
        required: false
        type: string
        default: ''

      tag:
        description: 'Tag to filter by (only if filter = by_tag)'
        required: false
        type: string
        default: ''

      include_drafts:
        description: 'Include draft products?'
        required: false
        type: boolean
        default: false

      dry_run:
        description: 'Dry run - preview only, do NOT update Shopify'
        required: false
        type: boolean
        default: false

      sample_count:
        description: 'Number of samples to show in preview (default: 5)'
        required: false
        type: string
        default: '5'

      batch_id:
        description: 'Batch ID (required for status/preview/download - from submit output)'
        required: false
        type: string
        default: ''

      max_workers:
        description: 'Concurrent API requests for realtime mode (default: 20)'
        required: false
        type: string
        default: '20'

      limit:
        description: 'Limit number of products to process (0 = no limit, use for testing)'
        required: false
        type: string
        default: '0'

      content_source:
        description: 'Source for product info'
        required: true
        default: 'product_data'
        type: choice
        options:
          - product_data
          - existing_pdp

jobs:
  batch-process:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Run batch processor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          MODEL_PROVIDER: ${{ github.event.inputs.model_provider }}
          PRODUCT_FILTER: ${{ github.event.inputs.product_filter }}
          FILTER_PRODUCT_TYPE: ${{ github.event.inputs.product_type }}
          FILTER_VENDOR: ${{ github.event.inputs.vendor }}
          FILTER_TAG: ${{ github.event.inputs.tag }}
          INCLUDE_DRAFTS: ${{ github.event.inputs.include_drafts }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SAMPLE_COUNT: ${{ github.event.inputs.sample_count }}
          BATCH_ID: ${{ github.event.inputs.batch_id }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          PRODUCT_LIMIT: ${{ github.event.inputs.limit }}
          CONTENT_SOURCE: ${{ github.event.inputs.content_source }}
        run: |
          python batch-processing/batch_processor.py ${{ github.event.inputs.action }}

      - name: Upload batch ID
        if: github.event.inputs.action == 'submit'
        uses: actions/upload-artifact@v4
        with:
          name: batch-id
          path: batch_id.txt
          retention-days: 30

      - name: Upload preview report
        if: github.event.inputs.action == 'preview' || github.event.inputs.action == 'download' || github.event.inputs.action == 'realtime' || github.event.inputs.action == 'realtime-live'
        uses: actions/upload-artifact@v4
        with:
          name: description-preview
          path: |
            preview_report.html
            batch_results.jsonl
          retention-days: 7
          if-no-files-found: ignore
